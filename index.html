<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunny Ears</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" data-scene="world">
    <canvas id="world"></canvas>
    <div class="quote-bubble" id="quoteBubble" role="status" hidden></div>
    <a class="open-link" id="openLink" target="_blank" rel="noopener" hidden></a>
    <div class="enter-prompt" id="enterPrompt" hidden>Press <kbd>E</kbd> to enter Cafe Lumen</div>

    <header class="hud hud-top">
      <nav class="minimap" aria-label="Where Anna is on the map">
        <div class="minimap-frame">
          <svg class="minimap-map" id="minimapMap" preserveAspectRatio="none" aria-hidden="true"></svg>
          <span class="minimap-dot" id="minimapDot" aria-hidden="true"></span>
        </div>
      </nav>
    </header>

    <div class="area-banner" id="areaBanner" aria-live="polite"></div>

    <div class="zoom-controls" role="group" aria-label="Zoom">
      <button class="zoom-toggle" id="zoomToggle" type="button">Zoom in on Anna</button>
      <button class="zoom-step" id="zoomOut" type="button" aria-label="Zoom out">&minus;</button>
      <button class="zoom-step" id="zoomIn" type="button" aria-label="Zoom in">+</button>
    </div>

    <!-- Inside Cafe Lumen, in the evening: lanterns, a shared table, soft music -->
    <section id="cafeScene" class="scene cafe-scene">
      <canvas id="cafeCanvas"></canvas>
      <button class="back-btn" id="cafeBack" type="button">&larr; Back to the city</button>
      <div class="cafe-header">
        <h2 class="cafe-title">Cafe Lumen</h2>
      </div>
      <button class="music-pill" id="musicToggle" type="button" aria-pressed="false" aria-label="Mute music">
        <span class="music-bars" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <span class="music-label" id="musicLabel">Soft music playing</span>
      </button>
      <div class="lab-prompt" id="cafePrompt" hidden>
        <span class="lab-prompt-title">Sit down and chat</span>
        <span class="lab-prompt-key">Press <kbd>E</kbd></span>
      </div>
    </section>

    <!-- Inside the Form Studio: a cozy lounge showing off the Sunny Ears cuffs -->
    <section id="labScene" class="scene lab-scene">
      <canvas id="labCanvas"></canvas>
      <button class="back-btn" id="labBack" type="button">&larr; Back to the city</button>
      <div class="lab-header">
        <h2 class="lab-title">Form Studio</h2>
      </div>
      <div class="lab-prompt" id="labPrompt" hidden>
        <span class="lab-prompt-title">Try on your new superpower</span>
        <span class="lab-prompt-key">Press <kbd>E</kbd></span>
      </div>
    </section>

    <!-- Jamie's house: her friend shows Anna the "subtitles for the world" built into her home -->
    <section id="subsScene" class="scene subs-scene">
      <canvas id="subsCanvas"></canvas>
      <button class="back-btn" id="subsBack" type="button">&larr; Back to the city</button>
      <div class="lab-header">
        <h2 class="lab-title">Jamie's World</h2>
      </div>
      <div class="quote-bubble story-bubble" id="storyBubble" role="status" aria-live="polite" hidden></div>
    </section>
  </div>

  <script src="main.js"></script>
</body>
</html>
